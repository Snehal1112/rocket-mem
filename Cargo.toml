[workspace]
resolver = "2"
members = ["crates/common", "crates/engine", "crates/protocol", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
bytes = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["codec"] }
