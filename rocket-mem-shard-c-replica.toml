# Replica of cluster node shard-c. Not a cluster member itself -- no cluster_config/
# cluster_node_id here. Becomes read-only once `REPLICAOF numericlabs.lxd 6381 AUTH app
# changeme` is sent to it -- the AUTH clause is required because shard-c has ACL users
# configured; a bare REPLICAOF fails with NOAUTH.

addr = "numericlabs.lxd:6481"
rmp_addr = "numericlabs.lxd:7481"
metrics_addr = "numericlabs.lxd:9223"

aof_path = "./appendonly-shard-c-replica.aof"
snapshot_path = "./dump-shard-c-replica.snapshot"

slowlog_threshold_micros = 0

# Must match shard-c's ACL users to authenticate the replication connection.
[[acl.users]]
username = "app"
password = "changeme"
enabled = true
rules = ["allcommands", "allkeys"]
