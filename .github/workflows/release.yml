name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner builds its own host triple natively -- no cross-compilation.
          - os: ubuntu-latest
            os_name: linux
            arch: amd64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            os_name: darwin
            arch: arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            os_name: windows
            arch: amd64
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin rocket-mem

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="rocket-mem-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p dist
          cp "target/release/rocket-mem${{ matrix.ext }}" "dist/${BINARY}"
          ARCHIVE="${BINARY}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C dist "${BINARY}"
          # Hash from inside dist so the recorded filename has no path prefix,
          # which lets consumers verify against a bare downloaded archive.
          cd dist
          command -v sha256sum >/dev/null 2>&1 && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" || shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="rocket-mem-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext }}"
          mkdir -p dist
          cp "target/release/rocket-mem${{ matrix.ext }}" "dist/${BINARY}"
          ARCHIVE="rocket-mem-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          7z a "dist/${ARCHIVE}" "dist/${BINARY}"
          # Hash from inside dist so the recorded filename has no path prefix.
          cd dist
          command -v sha256sum >/dev/null 2>&1 && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" || shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocket-mem-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # Builds from source independently of the cross-platform archives the `build` job
  # produces, so it doesn't wait on them; `needs: [changelog]` only keeps the job graph
  # simple to read, not because this job consumes the changelog.
  docker:
    name: Build & Push Docker Image
    needs: [changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects a mixed-case image name and `github.repository` carries the
      # owner segment verbatim, which is not lowercase for this repo.
      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest

  release:
    name: Publish GitHub Release
    needs: [build, changelog]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Only the `build` job's archives. Without a pattern this downloads every
      # artifact in the run, which includes the `.dockerbuild` build summary that
      # docker/build-push-action uploads on its own -- that one fails to extract
      # and takes the whole step down with it.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rocket-mem-*
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install minisign signer
        run: cargo install tauri-cli --locked

      # Detached minisign signatures over the checksummed archives -- proves
      # the archive came from whoever holds RELEASE_SIGNING_KEY, on top of the
      # sha256 files above (which only prove it wasn't corrupted in transit).
      # See CONTRIBUTING.md's "Release artifact signing" section for how the
      # key was generated and how a consumer verifies a downloaded archive.
      - name: Sign release artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            [ -e "$f" ] || continue
            cargo tauri signer sign "$f"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_BODY: ${{ needs.changelog.outputs.body }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "${VERSION}" \
            --draft \
            --title "rocket-mem ${VERSION}" \
            --notes "${CHANGELOG_BODY}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.tar.gz.sig \
            dist/*.zip dist/*.zip.sha256 dist/*.zip.sig
